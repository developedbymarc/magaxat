name: cpplint

on:
  pull_request:
    paths:
      - 'host/src/**/*.h'
      - 'host/src/**/*.hpp'
      - 'host/src/**/*.cpp'

jobs:
  cpplint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed Cpp-related files
        id: changed
        run: |
          git diff origin/main --name-only \
            | grep -E '\.(h|hpp|cpp)$' \
            | grep '^host/src/' \
            > changed_files.txt || true
          echo "files=$(cat changed_files.txt | tr '\n' ' ')" >> $GITHUB_OUTPUT

      - name: Run cpplint
        if: steps.changed.outputs.files != ''
        run: |
          COUNT=$(wc -l < changed_files.txt)
          echo "cpplint: checking $COUNT Cpp-related file(s)..."
          pipx run cpplint \
            --filter=-legal/copyright \
            ${{ steps.changed.outputs.files }}