name: CI

on:
  push:

# Least privilege by default; only the release job gets write access.
permissions:
  contents: read

# Newer pushes cancel stale runs on the same ref, except on main,
# where a cancelled run could interrupt a release.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  cpplint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run cpplint
        run: |
          find host/src -type f \( -name '*.h' -o -name '*.hpp' -o -name '*.cpp' \) -print0 \
            | xargs -0 --no-run-if-empty pipx run cpplint --filter=-legal/copyright

  # android-lint:
  #   runs-on: ubuntu-latest
  #   ...

  host-build:
    needs: cpplint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S host -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Stage binary
        run: |
          mkdir -p dist
          cp build/magaxat dist/magaxat-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: host-linux
          path: dist/magaxat-linux-x86_64
          retention-days: 7
          if-no-files-found: error

  # client-build:
  #   needs: android-lint
  #   ...

  release:
    if: github.ref == 'refs/heads/main'
    needs: [host-build] # TODO: add client-build once it exists
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read version and check whether it is already released
        id: version
        run: |
          # grab the version from metadata.toml and format as "major.minor.patch"
          VERSION=$(python3 - <<'EOF'
          import tomllib
          with open("metadata.toml", "rb") as f:
              v = tomllib.load(f)["app"]["version"]
          print(f'{v["major"]}.{v["minor"]}.{v["patch"]}')
          EOF
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # check if the tag already exists on the remote
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists, skipping release."
            echo "is_new=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag v$VERSION is new, releasing."
            echo "is_new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download build artifacts
        if: steps.version.outputs.is_new == 'true'
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        if: steps.version.outputs.is_new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
